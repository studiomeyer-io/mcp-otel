name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jeder Job hier liest nur den Quelltext. Ohne diesen
# Block erbt der Lauf die Standardrechte der Organisation, die schreibend
# sein koennen (OpenSSF Scorecard TokenPermissionsID, Schweregrad high).
permissions:
  contents: read

jobs:
  build-test:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: examples/ self-import "mcp-otel", which resolves via the
      # package's own exports -> dist/. Typechecking before the build fails in a
      # clean clone (no dist/ yet). prepublishOnly already builds before typecheck.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Run example (smoke)
        run: node examples/connected-trace.mjs
